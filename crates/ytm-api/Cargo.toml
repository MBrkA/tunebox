[package]
name = "ytm-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "gzip", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
tracing = "0.1.44"
ytm-core = { version = "0.1.0", path = "../ytm-core" }

[dev-dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[features]
live-tests = []
