name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: "Also build installers (.deb/AppImage, macOS .pkg or signed .dmg)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch/PR supersedes the running one (tags are never cancelled). The event is part of the
# group so a push to main does not cancel a manual packaging run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# check (every push/PR) → package (tags and manual runs with "package" ticked) → release (tags only).
# Each job has its own rust-cache (keyed by job), so the test-profile cache of `check` never evicts the release
# dependencies `package` needs.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libssl-dev libdbus-1-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev
      # puts rc.exe on PATH so build.rs can embed the icon
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # Windows is not a verified target yet: no fmt/clippy gate there, and the tests are informational. Compiling them
      # must still pass.
      - if: runner.os != 'Windows'
        run: cargo fmt --all --check
      - if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --no-run
      # Hermetic tests only: no network, no sound card.
      - run: cargo test --workspace
        continue-on-error: ${{ runner.os == 'Windows' }}
      # No release build here: clippy/test already compile everything, and the release profile (thin LTO) cost
      # 2-6 min per push. Release builds happen in `package`.

  package:
    # Manual run with the "package" box ticked, or a v* tag (feeds the release job).
    if: (github.event_name == 'workflow_dispatch' && inputs.package) || startsWith(github.ref, 'refs/tags/')
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            formats: deb,appimage
          - os: macos-14
            formats: app,dmg
          # Native MSVC exe zipped (the zig cross-build in scripts/package-windows.sh is for local use).
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libssl-dev libdbus-1-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os != 'Windows'
        run: cargo install cargo-packager --locked
      - run: cargo build --release -p ytm-app
      # macOS signing + notarisation only happens when the repository has the Apple secrets (see
      # .claude/skills/tunebox-release); without them (forks, PRs) the build stays unsigned as before.
      # cargo-packager reads APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD (a base64 Developer ID Application
      # .p12) and APPLE_ID / APPLE_PASSWORD (app-specific password) / APPLE_TEAM_ID for notarytool.
      - name: Are the Apple signing secrets set?
        id: apple
        shell: bash
        run: echo "signed=${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"
      - name: Package (signed and notarised)
        if: steps.apple.outputs.signed == 'true'
        run: cargo packager --release --formats ${{ matrix.formats }} --config "{\"macos\":{\"signingIdentity\":\"$APPLE_SIGNING_IDENTITY\"}}"
        working-directory: crates/ytm-app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Package
        if: steps.apple.outputs.signed != 'true' && runner.os == 'Linux'
        run: cargo packager --release --formats ${{ matrix.formats }}
        working-directory: crates/ytm-app
      # Unsigned macOS: ship the ad-hoc sealed .pkg, not the .dmg (its app is reported as "damaged", D37).
      - name: Package (unsigned macOS .pkg)
        if: steps.apple.outputs.signed != 'true' && runner.os == 'macOS'
        run: scripts/package-macos.sh
      - name: Package (Windows .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/tunebox-windows-x64 | Out-Null
          Copy-Item target/release/tunebox.exe dist/tunebox-windows-x64/
          Copy-Item LICENSE dist/tunebox-windows-x64/LICENSE.txt
          Copy-Item scripts/windows-README.txt dist/tunebox-windows-x64/README.txt
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          Compress-Archive -Path dist/tunebox-windows-x64 -DestinationPath "dist/tunebox_${version}_windows-x64.zip"
      # Installers only: dist/Tunebox.app is a directory and would be attached file by file.
      - uses: actions/upload-artifact@v7
        with:
          name: tunebox-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.pkg
            dist/*.zip

  release:
    # On a v* tag: attach the .deb/AppImage, macOS .pkg (or signed .dmg) and Windows zip to a *draft* GitHub release to review and publish.
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
