name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: "Also build installers (.deb/AppImage, macOS .pkg or signed .dmg)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch/PR supersedes the running one (tags are never cancelled).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libssl-dev libdbus-1-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Hermetic tests only: no network, no sound card.
      - run: cargo test --workspace
      # No release build here: clippy/test already compile everything, and the release profile (thin LTO) cost
      # 2-4 min per push. Release builds run in `package` and `windows` on tags and packaging runs.

  package:
    # Manual run with the "package" box ticked, or a v* tag (feeds the release job).
    if: (github.event_name == 'workflow_dispatch' && inputs.package) || startsWith(github.ref, 'refs/tags/')
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            formats: deb,appimage
          - os: macos-14
            formats: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libssl-dev libdbus-1-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev
      - run: cargo install cargo-packager --locked
      - run: cargo build --release -p ytm-app
      # macOS signing + notarisation only happens when the repository has the Apple secrets (see
      # .claude/skills/tunebox-release); without them (forks, PRs) the build stays unsigned as before.
      # cargo-packager reads APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD (a base64 Developer ID Application
      # .p12) and APPLE_ID / APPLE_PASSWORD (app-specific password) / APPLE_TEAM_ID for notarytool.
      - name: Are the Apple signing secrets set?
        id: apple
        shell: bash
        run: echo "signed=${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"
      - name: Package (signed and notarised)
        if: steps.apple.outputs.signed == 'true'
        run: cargo packager --release --formats ${{ matrix.formats }} --config "{\"macos\":{\"signingIdentity\":\"$APPLE_SIGNING_IDENTITY\"}}"
        working-directory: crates/ytm-app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Package
        if: steps.apple.outputs.signed != 'true' && runner.os == 'Linux'
        run: cargo packager --release --formats ${{ matrix.formats }}
        working-directory: crates/ytm-app
      # Unsigned macOS: ship the ad-hoc sealed .pkg, not the .dmg (its app is reported as "damaged", D37).
      - name: Package (unsigned macOS .pkg)
        if: steps.apple.outputs.signed != 'true' && runner.os == 'macOS'
        run: scripts/package-macos.sh
      # Installers only: dist/Tunebox.app is a directory and would be attached file by file.
      - uses: actions/upload-artifact@v4
        with:
          name: tunebox-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.pkg

  windows:
    # Native MSVC build of the Windows exe (the zig cross-build in scripts/package-windows.sh is for local use).
    # Not run on pull requests: Windows is not a verified target yet. Pushes only build and run the tests; the release
    # exe + zip (3-6 min) is built on tags and packaging runs, like the other installers.
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    env:
      RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.package) || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Separate caches so push runs (test profile only) don't evict the release dependencies tags need.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ env.RELEASE }}
      # puts rc.exe on PATH so build.rs can embed the icon
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Release build
        if: env.RELEASE == 'true'
        run: cargo build --release -p ytm-app
      # Compiling must pass even though running the tests is informational.
      - run: cargo test --workspace --no-run
      - name: Tests (informational until they have run on Windows at least once)
        run: cargo test --workspace
        continue-on-error: true
      - name: Zip
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/tunebox-windows-x64 | Out-Null
          Copy-Item target/release/tunebox.exe dist/tunebox-windows-x64/
          Copy-Item LICENSE dist/tunebox-windows-x64/LICENSE.txt
          Compress-Archive -Path dist/tunebox-windows-x64 -DestinationPath dist/tunebox-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: tunebox-windows-x64
          path: dist/tunebox-windows-x64.zip

  release:
    # On a v* tag: attach the .deb/AppImage, macOS .pkg (or signed .dmg) and Windows zip to a *draft* GitHub release to review and publish.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
