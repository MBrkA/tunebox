[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
ksni = { path = "vendor/ksni" }
